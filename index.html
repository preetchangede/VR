<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Forge suns between your palms. Build a world from their ashes. Then stand on it. A hands-only mixed reality experience for Meta Quest." />
    <meta name="theme-color" content="#05060d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23fff7e0'/%3E%3Cstop offset='.35' stop-color='%23ffc46b'/%3E%3Cstop offset='1' stop-color='%23ff6a3d' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3C/svg%3E" />
    <title>Sunsmith</title>
    <style>
      :root {
        --ink: #f6ecda;
        --dim: #b9ad9c;
        --gold: #ffc46b;
        --ember: #ff7a3d;
        --night: #05060d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); font-family: 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif; overflow: hidden; }
      #scene-container { position: fixed; inset: 0; }
      #landing {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; text-align: center; z-index: 10;
        background:
          radial-gradient(1200px 700px at 50% 120%, rgba(255, 122, 61, 0.22), transparent 60%),
          radial-gradient(900px 500px at 50% 45%, rgba(255, 196, 107, 0.08), transparent 70%),
          radial-gradient(circle at 50% 50%, #0b0d1c 0%, #05060d 70%);
        transition: opacity 0.8s ease;
      }
      #landing.hidden { opacity: 0; pointer-events: none; }
      #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
      .sun {
        width: 120px; height: 120px; border-radius: 50%; margin-bottom: 28px; position: relative;
        background: radial-gradient(circle at 45% 42%, #fffaf0 0%, #ffe3a3 22%, #ffb25a 48%, #ff6a3d 72%, rgba(255, 90, 40, 0) 74%);
        box-shadow: 0 0 60px 18px rgba(255, 160, 80, 0.35), 0 0 160px 60px rgba(255, 110, 50, 0.18);
        animation: breathe 5s ease-in-out infinite;
      }
      @keyframes breathe { 50% { transform: scale(1.06); box-shadow: 0 0 80px 26px rgba(255, 170, 90, 0.42), 0 0 200px 80px rgba(255, 110, 50, 0.22); } }
      h1 { margin: 0; font-weight: 300; letter-spacing: 0.42em; font-size: clamp(34px, 7vw, 64px); padding-left: 0.42em; position: relative; }
      .tag { margin: 18px 0 34px; color: var(--dim); font-size: clamp(16px, 2.4vw, 21px); font-weight: 300; line-height: 1.6; max-width: 620px; position: relative; }
      .tag em { color: var(--ink); font-style: normal; }
      button#begin {
        position: relative; cursor: pointer; border: 1px solid rgba(255, 196, 107, 0.55); color: #1a0f05;
        background: linear-gradient(180deg, #ffd893, #ffad55); border-radius: 999px; padding: 20px 64px;
        font-size: 22px; letter-spacing: 0.18em; font-weight: 600; text-transform: uppercase;
        box-shadow: 0 0 40px rgba(255, 170, 80, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      button#begin:hover { transform: scale(1.04); box-shadow: 0 0 60px rgba(255, 170, 80, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.6); }
      button#begin:disabled { opacity: 0.4; cursor: default; transform: none; }
      .notes { margin-top: 34px; display: flex; gap: 26px; flex-wrap: wrap; justify-content: center; color: var(--dim); font-size: 15px; position: relative; }
      .notes span::before { content: '✦'; color: var(--gold); margin-right: 8px; }
      #status { margin-top: 22px; min-height: 22px; color: var(--ember); font-size: 15px; position: relative; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="landing">
      <canvas id="stars"></canvas>
      <div class="sun" aria-hidden="true"></div>
      <h1>SUNSMITH</h1>
      <p class="tag">Forge suns between your palms.<br />Build a world from their ashes. <em>Then stand on it.</em></p>
      <button id="begin" disabled>Begin</button>
      <div class="notes">
        <span>Sit at a table</span><span>Hands only</span><span>About 10 minutes</span><span>Sound on</span>
      </div>
      <div id="status"></div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>

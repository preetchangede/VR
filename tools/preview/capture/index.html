<!doctype html><html><body><script type="module">
// Captures WebXR hand joint poses for IWER's named hand poses, in a local hand frame.
const names = ['wrist','thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip','index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip','middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip','ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip','pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip'];
window.capture = async (poses) => {
  const d = window.IWER_DEVICE;
  d.controlMode = 'programmatic';
  d.primaryInputMode = 'hand';
  const canvas = document.createElement('canvas'); document.body.appendChild(canvas);
  const gl = canvas.getContext('webgl2', { xrCompatible: true });
  const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['hand-tracking'] });
  session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
  const ref = await session.requestReferenceSpace('local');
  const out = {};
  // Read joints inside the frame callback (XRFrame is only valid there).
  const readOnce = () => new Promise((r) => session.requestAnimationFrame((t, f) => {
    const src = [...session.inputSources].find((s) => s.hand && s.handedness === 'right');
    if (!src) return r(null);
    r(names.map((n) => { const p = f.getJointPose(src.hand.get(n), ref); const m = p.transform.position; return [m.x, m.y, m.z, p.radius]; }));
  }));
  for (const pose of poses) {
    d.hands.right.poseId = pose;
    for (let i = 0; i < 6; i++) await readOnce();
    const P = await readOnce();
    // Hand frame: origin wrist; f = wrist->middle proximal; side = index meta -> pinky meta; n = palm normal (right hand).
    const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
    const dot = (a, b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
    const norm = (a) => { const l = Math.hypot(...a); return a.map((x) => x / l); };
    const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
    const w = P[0];
    const fw = norm(sub(P[11], w));
    const side0 = sub(P[20], P[5]);
    const n = norm(cross(fw, side0));
    const s = cross(n, fw);
    out[pose] = P.map((p) => { const v = sub(p, w); return [dot(v, s), dot(v, n), dot(v, fw), p[3]].map((x) => +x.toFixed(4)); });
  }
  await session.end();
  return out;
};
</script></body></html>

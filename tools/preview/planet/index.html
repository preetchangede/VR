<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SUNSMITH planet preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* A photo-ish stand-in for passthrough: a cool grey wall, a warm wooden
         tabletop with a soft lamp pool, grain, and a vignette. The canvas is
         composited over it exactly like Quest does: rgb + (1 - a) * passthrough. */
      body {
        background:
          radial-gradient(ellipse 60% 40% at 30% 18%, rgba(255, 236, 205, 0.18), transparent 70%),
          radial-gradient(ellipse 90% 70% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.45) 100%),
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
          repeating-linear-gradient(178deg, rgba(60, 40, 25, 0) 0px, rgba(60, 40, 25, 0.12) 3px, rgba(60, 40, 25, 0) 9px),
          linear-gradient(180deg, #6a6e74 0%, #5d6168 40%, #565a60 61%, #3b3229 61.5%, #5a4636 64%, #6b5442 80%, #5c4838 100%);
      }
      body.table {
        background:
          radial-gradient(ellipse 45% 35% at 50% 55%, rgba(255, 220, 170, 0.1), transparent 70%),
          radial-gradient(ellipse 90% 75% at 50% 50%, transparent 50%, rgba(0, 0, 0, 0.5) 100%),
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
          repeating-linear-gradient(91deg, rgba(50, 30, 15, 0) 0px, rgba(50, 30, 15, 0.14) 4px, rgba(50, 30, 15, 0) 13px),
          linear-gradient(180deg, #4b4f55 0%, #50545a 9%, #3a3029 9.4%, #5f4a39 14%, #6e5644 55%, #5e4939 100%);
      }
      body.dim::after {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(2, 4, 12, 0.62);
        pointer-events: none;
        z-index: -1;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 8px;
        bottom: 6px;
        font: 11px/1.3 ui-monospace, monospace;
        color: rgba(255, 255, 255, 0.75);
        text-shadow: 0 1px 2px #000;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
